<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />

    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
      <form action="/" method="POST" class="checkout-form" name="checkoutForm" id="checkoutForm">
        <fieldset>
          <legend>Customer Name</legend>
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" required />
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" required />
        </fieldset>
        <fieldset>
          <legend>Address</legend>
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" required />
          <label for="city">City</label>
          <input type="text" id="city" name="city" required />
          <label for="state">State</label>
          <input type="text" id="state" name="state" required />
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" required />
        </fieldset>
        <fieldset>
          <legend>Payment</legend>
          <label for="cardNumber">Credit Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" required />
          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" required />
          <label for="code">Security Code</label>
          <input type="text" id="code" name="code" required />
        </fieldset>
        <button class="checkout-button" id="checkoutSubmit">Checkout</button>
      </form>
      <section class="checkout-summary" id="checkoutSummary">
        <h3>Order Summary</h3>
        <p>Quantity: <span id="num-items">XX</span></p>
        <p>Subtotal: <span id="cartTotal">$XX.XX</span></p>
        <p>Tax: <span id="tax">Add zip code</span></p>
        <p>Shipping: <span id="shipping">Add zip code</span></p>
        <p>Total: <span id="orderTotal"></span></p>
      </section>
    </main>

    <footer id="footer"></footer>
  </body>
</html>
